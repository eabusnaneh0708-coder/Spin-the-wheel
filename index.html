<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exact IT Spin Wheel</title>

<style>
body {
    margin: 0;
    background: #1f1f1f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}

h1 {
    margin: 20px;
}

canvas {
    background: white;
    border-radius: 50%;
    max-width: 95vw;
    height: auto;
}

button {
    margin: 20px;
    padding: 12px 30px;
    font-size: 20px;
    cursor: pointer;
    background: #ffca3a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#winner {
    font-size: 25px;
    color: gold;
    margin: 0 20px 20px;
    text-align: center;
}
</style>
</head>

<body>
<h1>Exact IT</h1>

<canvas id="wheel" width="600" height="600"></canvas>

<button id="spinButton" onclick="spin()">SPIN</button>

<div id="winner"></div>

<script>
const options = [
    "Legend",
    "Squid",
    "Gay",
    "Bitch",
    "The most Goated IT Legend of all time",
    "Fish with no fins",
    "NOT GOOD ENOUGH",
    "Steven",
    "Steven but with 20/20 vision",
    "Words cant even encompass how bad you are",
    "IT Support Final Boss",
    "Certified Keyboard Warrior",
    "Printer Troubleshooting Victim",
    "WiFi Password Forgetter",
    "Employee of the Century"
];

const colors = [
    "#ff595e", "#ff924c", "#ffca3a", "#c5ca30", "#8ac926",
    "#52b788", "#1982c4", "#4267ac", "#6a4c93", "#d81159",
    "#f72585", "#7209b7", "#3a86ff", "#00b4d8", "#fb8500"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let rotation = 0;
let spinning = false;

function drawWheel() {
    ctx.clearRect(0, 0, 600, 600);

    const arc = (2 * Math.PI) / options.length;

    for (let i = 0; i < options.length; i++) {
        const angle = rotation + i * arc;

        ctx.beginPath();
        ctx.moveTo(300, 300);
        ctx.arc(300, 300, 250, angle, angle + arc);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = "white";
        ctx.font = "bold 12px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const maxWidth = 125;
        const words = options[i].split(" ");
        const lines = [];
        let currentLine = "";

        for (const word of words) {
            const testLine = currentLine
                ? currentLine + " " + word
                : word;

            if (ctx.measureText(testLine).width > maxWidth && currentLine) {
                lines.push(currentLine);
                currentLine = word;
            } else {
                currentLine = testLine;
            }
        }

        if (currentLine) lines.push(currentLine);

        const lineHeight = 14;
        const startY = -(lines.length - 1) * lineHeight / 2;

        for (let j = 0; j < lines.length; j++) {
            ctx.fillText(lines[j], 165, startY + j * lineHeight);
        }

        ctx.restore();
    }

    // Center circle
    ctx.beginPath();
    ctx.arc(300, 300, 40, 0, Math.PI * 2);
    ctx.fillStyle = "#333";
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Bottom pointer: the tip points UP toward the wheel
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.moveTo(300, 540);
    ctx.lineTo(282, 575);
    ctx.lineTo(318, 575);
    ctx.closePath();
    ctx.fill();
}

drawWheel();

function spin() {
    if (spinning) return;

    spinning = true;
    document.getElementById("spinButton").disabled = true;
    document.getElementById("winner").textContent = "";

    const extra = Math.random() * 360 + 1800;
    const start = rotation;
    const end = rotation + extra * Math.PI / 180;

    const duration = 7000;
    const startTime = performance.now();

    function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);

        rotation = start + (end - start) * ease;
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            const arc = (2 * Math.PI) / options.length;
            const adjusted = (
                2 * Math.PI -
                (rotation % (2 * Math.PI)) +
                Math.PI / 2
            ) % (2 * Math.PI);

            const winner = Math.floor(adjusted / arc) % options.length;

            document.getElementById("winner").innerHTML =
                "YOU are: <b>" + options[winner] + "</b>";

            spinning = false;
            document.getElementById("spinButton").disabled = false;
        }
    }

    requestAnimationFrame(animate);
}
</script>
</body>
</html>
